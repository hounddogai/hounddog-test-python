version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    # Matches exclude-newer in pyproject.toml so uv can lock every proposed version.
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        applies-to: version-updates
        patterns: ["*"]
      python-security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security-updates:
        applies-to: security-updates
        patterns: ["*"]
